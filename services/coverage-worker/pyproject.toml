[project]
name = "baolsec-coverage-worker"
version = "0.1.0"
description = "BaolSec — Service Couverture : suivi des sources et évaluation des états de couverture (C17)"
requires-python = ">=3.12"
dependencies = [
    "baolsec-common[nats]",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.8",
    "psycopg-pool==3.3.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coverage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
baolsec-common = { path = "../../shared/python-common", editable = true }
