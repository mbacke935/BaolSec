[project]
name = "baolsec-indexing-worker"
version = "0.1.0"
description = "BaolSec — Indexing Worker : indexation des événements, alertes et incidents dans OpenSearch (C19)"
requires-python = ">=3.12"
dependencies = [
    "baolsec-common[nats]",
    "opensearch-py==2.8.0",
    "pydantic-settings==2.16.2",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.8",
    "psycopg-pool==3.3.3",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
indexing-worker = "indexing_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexing_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
