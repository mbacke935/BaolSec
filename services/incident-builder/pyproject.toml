[project]
name = "baolsec-incident-builder"
version = "0.1.0"
description = "BaolSec — Service Incidents : état et suivi des alertes (C15), corrélation (C16), chronologie (C17)"
requires-python = ">=3.12"
dependencies = [
    "baolsec-common[nats]",
    "jsonschema-rs==0.59.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.8",
    "psycopg-pool==3.3.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx==0.28.1", "jsonschema==4.26.0", "rfc3339-validator==0.1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
baolsec-common = { path = "../../shared/python-common", editable = true }
