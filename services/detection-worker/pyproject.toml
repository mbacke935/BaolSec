[project]
name = "baolsec-detection-worker"
version = "0.1.0"
description = "BaolSec — Moteur de détection (C12, C14)"
requires-python = ">=3.12"
dependencies = [
    "baolsec-common[nats]",
    "pyyaml==6.0.2",
    "jsonschema-rs==0.59.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.8",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "jsonschema==4.26.0", "rfc3339-validator==0.1.4"]

[tool.uv.sources]
baolsec-common = { path = "../../shared/python-common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
