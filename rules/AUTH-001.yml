# Règle de référence de C14 : 5 échecs d'authentification en 10 minutes pour un même couple
# utilisateur + IP source (scénarios D1 et D2 de C2). Format : contrat rule/v1.
id: AUTH-001
name: Force brute sur un compte
description: >
  Échecs d'authentification répétés pour un même utilisateur depuis une même adresse,
  quelle que soit la source (SSH Linux, ouverture de session Windows, connexion à l'API web).
severity: elevee
type: window
category: [authentication]
match:
  event.category: authentication
  event.outcome: failure
group_by: [user.name, source.ip]
window: 10m
threshold: 5
message: "{count} échecs d'authentification en {window} pour {user.name} depuis {source.ip}"
requires:
  - source_type: linux
    fields: [user.name, source.ip]
  - source_type: windows
    fields: [user.name, source.ip]
