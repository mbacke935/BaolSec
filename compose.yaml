# BaolSec — pile complète (C18) : docker compose up -d
#
# La pile applicative est définie une seule fois, dans infrastructure/compose/compose.yaml
# (broker et sa topologie, PostgreSQL et ses migrations, OpenSearch, passerelle, normalisation,
# détection, incidents, couverture, indexation, API, interface, sauvegardes). Ce fichier l'inclut et
# ajoute la supervision (Prometheus, Grafana, EF-12).
#
# Avant le premier démarrage :
#   cp .env.example .env        puis remplir chaque valeur (openssl rand -hex 24 pour les secrets)
#   make gateway-dev            certificats et sources de développement (infrastructure/tls/dev/)
#
# Accès : interface https://localhost (certificat de développement), Grafana http://127.0.0.1:3001,
# Prometheus http://127.0.0.1:9090. Les autres ports ne sont publiés que sur 127.0.0.1 (ES-04).
#
# Remplace l'ancien compose.yaml racine (C18), qui décrivait une seconde pile divergente : noms de
# services différents de .env (nats/postgres au lieu de broker/postgresql), variables ignorées par
# les services (NATS_URL, POSTGRES_DSN sans préfixe), détection désactivée (profil « todo ») et base
# sans schéma (aucune migration lancée) : elle ne pouvait pas fonctionner.

name: baolsec

include:
  - path: infrastructure/compose/compose.yaml
    env_file: .env

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks: [internal]

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD manquant dans .env}
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/baolsec-plateforme.json
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks: [internal]

volumes:
  prometheus-data:
  grafana-data:
