  /system/health:
    get:
      operationId: getPlatformHealth
      summary: 'État de la plateforme (EF-12) : services, PostgreSQL, OpenSearch, broker et retard des consommateurs'
      tags:
      - Supervision
      x-baolsec-roles: *id012
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - up
                    - degraded
                    - down
                  checked_at:
                    type: string
                    format: date-time
                  components:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        kind:
                          type: string
                          enum:
                          - service
                          - donnees
                        status:
                          type: string
                          enum:
                          - up
                          - degraded
                          - down
                        latency_ms:
                          type:
                          - integer
                          - 'null'
                        detail: {}
                  streams:
                    type: array
                    items:
                      type: object
        '401': *id010
        '403': *id011
      description: « down » si PostgreSQL ou le broker sont indisponibles ; « degraded » si un autre composant ne
        répond pas.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'accès de courte durée, renouvelable par /auth/refresh.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    From:
      name: from
      in: query
      schema: &id016
        type: string
        format: date-time
      description: Début de période (inclus)
    To:
      name: to
      in: query
      schema: *id016
      description: Fin de période (exclue)
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id002
      description: UUID choisi par le client pour cette action ; devient le command_id.
  responses:
    BadRequest:
      description: Requête mal formée
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Non authentifié ou jeton expiré
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Rôle insuffisant (refus inscrit dans l'audit)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflit avec l'état actuel
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Données invalides
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Limite de débit dépassée
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Service dépendant indisponible (OpenSearch, service Incidents…)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title: &id017
          type: string
          minLength: 1
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field: *id017
              message: *id017
            required:
            - field
            - message
      required:
      - title
      - status
      description: Erreur au format RFC 9457 (application/problem+json).
    CommandProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - command_result
        properties:
          command_result:
            $ref: ../../shared/contracts/incident_command/v1/result.schema.json
    Page:
      type: object
      additionalProperties: true
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - page
      - size
      - total
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username: *id017
        password:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - username
      - password
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - refresh_token
    TokenPair:
      type: object
      additionalProperties: false
      properties:
        access_token: *id017
        refresh_token: *id017
        token_type:
          const: Bearer
        expires_in:
          type: integer
          description: Durée de validité du jeton d'accès, en secondes
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
    RoleName:
      type: string
      enum:
      - administrateur
      - analyste
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        username: *id017
        email:
          type:
          - string
          - 'null'
          format: email
        full_name: *id017
        role:
          $ref: '#/components/schemas/RoleName'
        is_active:
          type: boolean
        locked_until:
          type:
          - string
          - 'null'
          format: date-time
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at: *id016
      required:
      - id
      - username
      - role
      - is_active
      - created_at
    UserCreate:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          pattern: ^[a-z0-9._-]{3,64}$
        full_name: *id017
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/RoleName'
      required:
      - username
      - full_name
      - role
      description: Un mot de passe temporaire est généré et transmis hors de l'API ; il est stocké haché (Argon2).
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        full_name: *id017
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/RoleName'
    Role:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/RoleName'
        description:
          type: string
        permissions:
          type: array
          items: *id017
      required:
      - name
      - permissions
    SourceType:
      type: string
      enum:
      - linux
      - windows
      - firewall
      - http
    Source:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id017
        source_type:
          $ref: '#/components/schemas/SourceType'
        transport:
          enum:
          - https
          - syslog
        ingestion_mode:
          enum:
          - direct
          - rejeu
        host:
          type:
          - string
          - 'null'
        silence_threshold_s:
          type: integer
          minimum: 60
        expected_min_events_per_h:
          type:
          - integer
          - 'null'
          minimum: 0
        criticality:
          type:
          - string
          - 'null'
          enum:
          - faible
          - moyenne
          - elevee
          - critique
          - null
          description: Criticité de l'actif, copiée dans baolsec.source.criticality des événements
        is_enabled:
          type: boolean
        active_credentials:
          type: integer
          minimum: 0
          maximum: 2
        created_at: *id016
        updated_at: *id016
      required:
      - id
      - name
      - source_type
      - transport
      - ingestion_mode
      - silence_threshold_s
      - is_enabled
      - active_credentials
    SourceCreate:
      type: object
      additionalProperties: false
      properties:
        name: *id017
        source_type:
          $ref: '#/components/schemas/SourceType'
        transport:
          enum:
          - https
          - syslog
        ingestion_mode:
          enum:
          - direct
          - rejeu
          default: direct
        host: *id017
        silence_threshold_s:
          type: integer
          minimum: 60
          default: 600
        expected_min_events_per_h:
          type: integer
          minimum: 0
        criticality:
          enum:
          - faible
          - moyenne
          - elevee
          - critique
        credential:
          $ref: '#/components/schemas/CredentialCreate'
      required:
      - name
      - source_type
      - transport
      - credential
    SourceUpdate:
      type: object
      additionalProperties: false
      properties:
        name: *id017
        host: *id017
        silence_threshold_s:
          type: integer
          minimum: 60
        expected_min_events_per_h:
          type:
          - integer
          - 'null'
          minimum: 0
        criticality:
          type:
          - string
          - 'null'
          enum:
          - faible
          - moyenne
          - elevee
          - critique
          - null
          description: Criticité de l'actif, copiée dans baolsec.source.criticality des événements
        is_enabled:
          type: boolean
    CredentialCreate:
      type: object
      additionalProperties: false
      properties:
        credential_type:
          enum:
          - token
          - client_cert
        cert_fingerprint:
          type: string
          pattern: ^[0-9A-Fa-f:]{32,128}$
        expires_at: *id016
      required:
      - credential_type
      description: client_cert exige cert_fingerprint ; token génère un secret.
    Credential:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        credential_type:
          enum:
          - token
          - client_cert
        cert_fingerprint:
          type:
          - string
          - 'null'
        created_at: *id016
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - credential_type
      - created_at
    CredentialCreated:
      allOf:
      - $ref: '#/components/schemas/Credential'
      - type: object
        properties:
          secret:
            type: string
            description: Jeton en clair, affiché une seule fois ; seul son hachage est stocké.
    SourceCreated:
      allOf:
      - $ref: '#/components/schemas/Source'
      - type: object
        required:
        - credential
        properties:
          credential:
            $ref: '#/components/schemas/CredentialCreated'
    Rule:
      type: object
      additionalProperties: false
      properties:
        id: *id017
        name: *id017
        description:
          type: string
        rule_type:
          enum:
          - simple
          - window
        severity: *id018
        is_enabled:
          type: boolean
        current_version:
          type: integer
          minimum: 1
        updated_at: *id016
      required:
      - id
      - name
      - rule_type
      - severity
      - is_enabled
      - current_version
    RuleRequirement:
      type: object
      additionalProperties: false
      properties:
        source_type:
          $ref: '#/components/schemas/SourceType'
        source_id:
          type:
          - string
          - 'null'
          format: uuid
        required_fields:
          type: array
          items: *id017
      required:
      - source_type
    RuleDetail:
      allOf:
      - $ref: '#/components/schemas/Rule'
      - type: object
        required:
        - definition_yaml
        - requirements
        properties:
          definition_yaml:
            type: string
          requirements:
            type: array
            items:
              $ref: '#/components/schemas/RuleRequirement'
    RuleWrite:
      type: object
      additionalProperties: false
      properties:
        name: *id017
        description:
          type: string
        severity: *id018
        definition_yaml:
          type: string
          minLength: 1
          description: Définition YAML validée par le schéma des règles ; n'utilise que des champs normalisés (ECS
            ou baolsec.*).
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/RuleRequirement'
      required:
      - name
      - severity
      - definition_yaml
      - requirements
    RuleVersion:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
        checksum: *id017
        created_by: *id017
        created_at: *id016
        definition_yaml:
          type: string
      required:
      - version
      - checksum
      - created_at
    Setting:
      type: object
      additionalProperties: false
      properties:
        key: *id017
        value: {}
        updated_by:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - key
      - value
    SettingUpdate:
      type: object
      additionalProperties: false
      properties:
        value: {}
      required:
      - value
    DlqEntry:
      type: object
      additionalProperties: false
      properties:
        seq:
          type: integer
          minimum: 1
        received_at: *id016
        service: *id017
        original_stream: *id017
        reason_code: *id017
        reason: *id017
        message_id: *id017
        source_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - seq
      - received_at
      - service
      - original_stream
      - reason_code
      - reason
      - message_id
      description: Résumé d'un message du flux dlq (sans le contenu d'origine).
    DlqDetail:
      type: object
      additionalProperties: false
      properties:
        seq:
          type: integer
          minimum: 1
        received_at: *id016
        message:
          $ref: ../../shared/contracts/dlq_message/v1/schema.json
      required:
      - seq
      - received_at
      - message
    AuditEntry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        occurred_at: *id016
        actor_username: *id017
        action: *id017
        target_type:
          type:
          - string
          - 'null'
        target_id:
          type:
          - string
          - 'null'
        outcome:
          enum:
          - succes
          - refus
          - echec
        client_ip:
          type:
          - string
          - 'null'
        details:
          type: object
      required:
      - id
      - occurred_at
      - actor_username
      - action
      - outcome
    AlertStatus:
      type: string
      enum:
      - nouvelle
      - en_cours
      - cloturee
    AlertState:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/AlertStatus'
        assigned_to:
          type:
          - string
          - 'null'
          format: uuid
        status_changed_at: *id016
        incident_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - status
      - status_changed_at
      description: État de traitement (PostgreSQL, schéma incidents).
    AlertView:
      type: object
      additionalProperties: false
      properties:
        alert:
          $ref: ../../shared/contracts/alert/v1/schema.json
        state:
          $ref: '#/components/schemas/AlertState'
      required:
      - alert
      - state
      description: Contenu immuable (OpenSearch) assemblé avec l'état de traitement (PostgreSQL).
    AlertDetail:
      allOf:
      - $ref: '#/components/schemas/AlertView'
      - type: object
        required:
        - events
        properties:
          events:
            type: array
            items:
              $ref: '#/components/schemas/EventRef'
    EventRef:
      type: object
      additionalProperties: false
      properties:
        event_id: *id019
        available:
          type: boolean
          description: false si l'événement a été purgé d'OpenSearch
        event:
          $ref: ../../shared/contracts/normalized_event/v1/schema.json
      required:
      - event_id
      - available
    AlertStatusChange:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/AlertStatus'
      required:
      - status
    Assignment:
      type: object
      additionalProperties: false
      properties:
        assignee_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - assignee_id
    IncidentStatus:
      type: string
      enum:
      - ouvert
      - en_cours
      - clos
    IncidentStatusChange:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/IncidentStatus'
      required:
      - status
    CommentCreate:
      type: object
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
      required:
      - body
    Reason:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 2000
    IncidentSummary:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        title: *id017
        status:
          $ref: '#/components/schemas/IncidentStatus'
        severity: *id018
        entities:
          type: object
          additionalProperties: false
          properties:
            user:
              type: array
              items: *id017
            ip:
              type: array
              items: *id017
            hosts:
              type: array
              items: *id017
        alert_count:
          type: integer
          minimum: 1
        assigned_to:
          type:
          - string
          - 'null'
          format: uuid
        opened_at: *id016
        last_activity_at: *id016
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - title
      - status
      - severity
      - alert_count
      - opened_at
      - last_activity_at
    TimelineEntry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        occurred_at: *id016
        recorded_at: *id016
        entry_type:
          enum:
          - event
          - alert
          - status_change
          - comment
          - correlation
          - conflict
        alert_id:
          type:
          - string
          - 'null'
        event_id:
          type:
          - string
          - 'null'
        summary: *id017
        actor:
          type:
          - string
          - 'null'
        justification:
          $ref: '#/components/schemas/CorrelationJustification'
      required:
      - id
      - occurred_at
      - entry_type
      - summary
    CorrelationJustification:
      type: object
      additionalProperties: false
      properties:
        rule:
          enum:
          - R1
          - R2
          - R3
          - R4
          - creation
        shared_entities:
          type: object
          additionalProperties: false
          properties:
            user.name: *id017
            source.ip: *id017
            host.name: *id017
            destination.ip: *id017
        gap_seconds:
          type: integer
          minimum: 0
        window_minutes:
          type: integer
          minimum: 1
        excluded_candidates:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              incident_id: *id002
              exclusion:
                enum:
                - E1
                - E2
                - E3
                - E4
                - E5
            required:
            - incident_id
            - exclusion
      required:
      - rule
      description: Justification enregistrée par le service Incidents (C3 3.8).
    IncidentAlert:
      type: object
      additionalProperties: false
      properties:
        alert_id: *id020
        rule_id: *id017
        severity: *id018
        triggered_at: *id016
        status:
          $ref: '#/components/schemas/AlertStatus'
        attached_at: *id016
        criteria:
          $ref: '#/components/schemas/CorrelationJustification'
      required:
      - alert_id
      - rule_id
      - triggered_at
      - attached_at
      - criteria
    Comment:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        author: *id017
        body: *id017
        created_at: *id016
      required:
      - id
      - author
      - body
      - created_at
    IncidentDetail:
      allOf:
      - $ref: '#/components/schemas/IncidentSummary'
      - type: object
        required:
        - alerts
        - timeline
        - comments
        properties:
          alerts:
            type: array
            items:
              $ref: '#/components/schemas/IncidentAlert'
          timeline:
            type: array
            items:
              $ref: '#/components/schemas/TimelineEntry'
          comments:
            type: array
            items:
              $ref: '#/components/schemas/Comment'
    CoverageStateValue:
      type: string
      enum:
      - INCONNUE
      - ACTIVE
      - SILENCIEUSE
      - FLUX_INCOMPLET
      - DESACTIVEE
    CoverageState:
      type: object
      additionalProperties: false
      properties:
        source_id: *id002
        source_name: *id017
        state:
          $ref: '#/components/schemas/CoverageStateValue'
        state_since: *id016
        last_received_at:
          type:
          - string
          - 'null'
          format: date-time
        last_normalized_at:
          type:
          - string
          - 'null'
          format: date-time
        silence_threshold_s:
          type: integer
        affected_rule_ids:
          type: array
          items: *id017
      required:
      - source_id
      - source_name
      - state
      - state_since
      - affected_rule_ids
    CoverageDetail:
      allOf:
      - $ref: '#/components/schemas/CoverageState'
      - type: object
        required:
        - history
        - stats
        - affected_rules
        properties:
          history:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                from_state:
                  $ref: '#/components/schemas/CoverageStateValue'
                to_state:
                  $ref: '#/components/schemas/CoverageStateValue'
                reason:
                  type: string
                changed_at: *id016
              required:
              - to_state
              - changed_at
          stats:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                bucket_start: *id016
                received_count:
                  type: integer
                normalized_count:
                  type: integer
                rejected_count:
                  type: integer
                error_count:
                  type: integer
              required:
              - bucket_start
              - received_count
              - normalized_count
          affected_rules:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                rule_id: *id017
                rule_name: *id017
                cause:
                  enum:
                  - silence
                  - flux_incomplet
                  - desactivee
                since: *id016
                resolved_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
              required:
              - rule_id
              - cause
              - since
