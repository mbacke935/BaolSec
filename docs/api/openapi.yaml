openapi: 3.1.0
info:
  title: API BaolSec
  version: 1.0.0
  description: 'API REST de BaolSec (service 7, C3 4.9) : consultation et gestion, sans aucune ingestion d''événements.
    Droits vérifiés côté serveur à chaque requête selon la matrice de C2 (section 3). Chaque opération indique les
    rôles autorisés (x-baolsec-roles) et son type d''accès (x-baolsec-access : lecture, écriture, commande). Les
    modifications d''incidents et d''alertes sont des commandes transmises au service Incidents (contrat incident_command/v1).
    Toutes les actions de gestion et tous les refus d''accès sont inscrits dans le journal d''audit.'
servers:
- url: /api/v1
security:
- bearerAuth: []
tags:
- name: Authentification
- name: Utilisateurs
- name: Sources
- name: Règles
- name: Paramètres
- name: Audit
- name: File de rejet
- name: Événements
- name: Alertes
- name: Incidents
- name: Couverture
- name: Recherche
  description: Recherche Lucene dans les index
- name: Supervision
  description: État de la plateforme
paths:
  /auth/login:
    post:
      operationId: login
      summary: Ouvrir une session
      tags:
      - Authentification
      x-baolsec-roles:
      - public
      x-baolsec-access: public
      responses:
        '200':
          description: Jetons d'accès et de renouvellement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: Mot de passe vérifié avec Argon2. Verrouillage temporaire après des échecs répétés (5 échecs,
        15 min par défaut) ; limitation de débit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /auth/refresh:
    post:
      operationId: refresh
      summary: Renouveler le jeton d'accès
      tags:
      - Authentification
      x-baolsec-roles:
      - public
      x-baolsec-access: public
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security: []
  /auth/logout:
    post:
      operationId: logout
      summary: Fermer la session (révoque le jeton de renouvellement)
      tags:
      - Authentification
      x-baolsec-roles:
      - administrateur
      - analyste
      x-baolsec-access: écriture
      responses:
        '204':
          description: Session fermée
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      operationId: me
      summary: Utilisateur connecté et son rôle
      tags:
      - Authentification
      x-baolsec-roles:
      - administrateur
      - analyste
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      operationId: listUsers
      summary: Lister les utilisateurs
      tags:
      - Utilisateurs
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum:
          - administrateur
          - analyste
        description: Filtrer par rôle
      - name: active
        in: query
        required: false
        schema:
          type: boolean
        description: Filtrer par état
    post:
      operationId: createUser
      summary: Créer un utilisateur
      tags:
      - Utilisateurs
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: écriture
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
  /users/{user_id}:
    get:
      operationId: getUser
      summary: Consulter un utilisateur
      tags:
      - Utilisateurs
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - &id001
        name: user_id
        in: path
        required: true
        schema: &id002
          type: string
          format: uuid
        description: Identifiant de l'utilisateur
    patch:
      operationId: updateUser
      summary: Modifier un utilisateur (nom, e-mail, rôle)
      tags:
      - Utilisateurs
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: écriture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
  /users/{user_id}/deactivate:
    post:
      operationId: deactivateUser
      summary: Désactiver un compte (jamais de suppression)
      tags:
      - Utilisateurs
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: écriture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - *id001
  /users/{user_id}/reactivate:
    post:
      operationId: reactivateUser
      summary: Réactiver un compte
      tags:
      - Utilisateurs
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: écriture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - *id001
  /roles:
    get:
      operationId: listRoles
      summary: Lister les rôles et leurs permissions
      tags:
      - Utilisateurs
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /sources:
    get:
      operationId: listSources
      summary: Lister les sources
      tags:
      - Sources
      x-baolsec-roles:
      - administrateur
      - analyste
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SourceType'
        description: Type de source
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
        description: Sources activées ou non
    post:
      operationId: createSource
      summary: Déclarer une source
      tags:
      - Sources
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: écriture
      responses:
        '201':
          description: Source créée ; le secret du premier identifiant n'est affiché qu'une fois
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreate'
  /sources/{source_id}:
    get:
      operationId: getSource
      summary: Consulter une source (sans secret)
      tags:
      - Sources
      x-baolsec-roles:
      - administrateur
      - analyste
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - &id003
        name: source_id
        in: path
        required: true
        schema: *id002
        description: Identifiant de la source
    patch:
      operationId: updateSource
      summary: Modifier une source (nom, seuil de silence, volume attendu, activation)
      tags:
      - Sources
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: écriture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
  /sources/{source_id}/credentials:
    post:
      operationId: rotateCredential
      summary: Créer un nouvel identifiant (rotation)
      tags:
      - Sources
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: écriture
      responses:
        '201':
          description: Identifiant créé ; secret affiché une seule fois
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      description: Refusé (409) si la source a déjà deux identifiants actifs (RG-04).
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreate'
    get:
      operationId: listSourceCredentials
      summary: Identifiants d'une source (métadonnées, jamais le secret)
      tags:
      - Sources
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credential'
        '401': &id010
          $ref: '#/components/responses/Unauthorized'
        '403': &id011
          $ref: '#/components/responses/Forbidden'
      parameters: &id015
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identifiant de la source
  /sources/{source_id}/credentials/{credential_id}/revoke:
    post:
      operationId: revokeCredential
      summary: Révoquer un identifiant
      tags:
      - Sources
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: écriture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - *id003
      - name: credential_id
        in: path
        required: true
        schema: *id002
        description: Identifiant de l'identifiant de source
  /rules:
    get:
      operationId: listRules
      summary: Lister les règles de détection
      tags:
      - Règles
      x-baolsec-roles:
      - administrateur
      - analyste
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Rule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
        description: Règles actives ou non
    post:
      operationId: createRule
      summary: Créer une règle (version 1)
      tags:
      - Règles
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: écriture
      responses:
        '201':
          description: Règle créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleWrite'
  /rules/{rule_id}:
    get:
      operationId: getRule
      summary: Consulter une règle et sa version appliquée
      tags:
      - Règles
      x-baolsec-roles:
      - administrateur
      - analyste
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - &id004
        name: rule_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2,5}-[0-9]{3}$
        description: Identifiant de la règle (ex. AUTH-001)
    put:
      operationId: updateRule
      summary: Modifier une règle (crée une nouvelle version)
      tags:
      - Règles
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: écriture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleWrite'
  /rules/{rule_id}/versions:
    get:
      operationId: listRuleVersions
      summary: Historique des versions d'une règle
      tags:
      - Règles
      x-baolsec-roles:
      - administrateur
      - analyste
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - *id004
  /rules/{rule_id}/enable:
    post:
      operationId: enableRule
      summary: Activer une règle
      tags:
      - Règles
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: écriture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - *id004
  /rules/{rule_id}/disable:
    post:
      operationId: disableRule
      summary: Désactiver une règle
      tags:
      - Règles
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: écriture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - *id004
  /settings:
    get:
      operationId: listSettings
      summary: Lister les paramètres
      tags:
      - Paramètres
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Setting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /settings/{key}:
    patch:
      operationId: updateSetting
      summary: Modifier un paramètre
      tags:
      - Paramètres
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: écriture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9_.]+$
        description: Clé du paramètre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpdate'
  /audit:
    get:
      operationId: listAudit
      summary: Consulter le journal d'audit (ajout seul)
      tags:
      - Audit
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - name: actor
        in: query
        required: false
        schema:
          type: string
        description: Identifiant de l'auteur
      - name: action
        in: query
        required: false
        schema:
          type: string
        description: Action
      - name: outcome
        in: query
        required: false
        schema:
          type: string
          enum:
          - succes
          - refus
          - echec
        description: Résultat
  /dlq:
    get:
      operationId: listDlq
      summary: Lister les messages rejetés (file de rejet)
      tags:
      - File de rejet
      x-baolsec-roles:
      - administrateur
      x-baolsec-access: lecture
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  required:
                  - items
                  properties:
