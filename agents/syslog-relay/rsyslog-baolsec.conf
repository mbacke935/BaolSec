# Relais Syslog BaolSec (C7) : reçoit les journaux de pfSense et les transmet à la passerelle
# en Syslog TLS (RFC 5425), avec une file persistante sur disque.
#
# Variables d'environnement lues au démarrage :
#   BAOLSEC_GATEWAY_HOST   nom de la passerelle (doit figurer dans son certificat)
#   BAOLSEC_GATEWAY_PORT   6514 par défaut côté passerelle
#   BAOLSEC_RELAY_DIR      dossier des certificats (sources-ca.crt, syslog-relay.crt, syslog-relay.key)
#   BAOLSEC_SPOOL_DIR      dossier de la file persistante
#   BAOLSEC_LISTEN_PORT    port d'écoute UDP/TCP pour pfSense (514)

global(
  workDirectory=`echo $BAOLSEC_SPOOL_DIR`
  maxMessageSize="64k"
  defaultNetstreamDriver="ossl"
  defaultNetstreamDriverCAFile=`echo $BAOLSEC_RELAY_DIR/sources-ca.crt`
  defaultNetstreamDriverCertFile=`echo $BAOLSEC_RELAY_DIR/syslog-relay.crt`
  defaultNetstreamDriverKeyFile=`echo $BAOLSEC_RELAY_DIR/syslog-relay.key`
)

# Journaux du relais lui-même : sortie standard (visible avec docker logs)
module(load="imuxsock" SysSock.Use="off")
module(load="imudp")
module(load="imtcp")

# Le message transmis est le message reçu, inchangé (contenu brut, C5 raw_event.payload).
template(name="BaolSecRaw" type="string" string="%rawmsg%")

ruleset(name="vers_passerelle") {
  action(
    type="omfwd"
    name="passerelle_baolsec"
    target=`echo $BAOLSEC_GATEWAY_HOST`
    port=`echo $BAOLSEC_GATEWAY_PORT`
    protocol="tcp"
    TCP_Framing="octet-counted"
    template="BaolSecRaw"
    StreamDriver="ossl"
    StreamDriverMode="1"
    StreamDriverAuthMode="x509/name"
    StreamDriverPermittedPeers=`echo $BAOLSEC_GATEWAY_HOST`

    # File persistante : conservée sur disque si la passerelle ou le réseau est indisponible,
    # rejouée à la reconnexion, préservée à l'arrêt du relais.
    queue.type="LinkedList"
    queue.filename="passerelle"
    queue.saveOnShutdown="on"
    queue.maxDiskSpace="1g"
    queue.size="100000"
    queue.highWatermark="80000"
    queue.lowWatermark="20000"
    queue.checkpointInterval="100"
    queue.syncqueuefiles="on"
    action.resumeRetryCount="-1"
    action.resumeInterval="5"
  )
}

# pfSense envoie en UDP (ou TCP) sur le réseau local, vers ce relais placé près de lui.
input(type="imudp" port=`echo $BAOLSEC_LISTEN_PORT` ruleset="vers_passerelle")
input(type="imtcp" port=`echo $BAOLSEC_LISTEN_PORT` ruleset="vers_passerelle")
