# BaolSec — Prometheus (C18)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: baolsec

scrape_configs:
  - job_name: nats
    static_configs:
      - targets: ["nats:8222"]
    metrics_path: /varz

  - job_name: gateway
    static_configs:
      - targets: ["gateway:9100"]

  - job_name: normalizer
    static_configs:
      - targets: ["normalizer:9101"]

  - job_name: enricher
    static_configs:
      - targets: ["enricher:9102"]

  - job_name: rule-engine
    static_configs:
      - targets: ["rule-engine:9103"]

  - job_name: incident-builder
    static_configs:
      - targets: ["incident-builder:9104"]

  - job_name: coverage-worker
    static_configs:
      - targets: ["coverage-worker:9105"]

  - job_name: indexing-worker
    static_configs:
      - targets: ["indexing-worker:9106"]

  - job_name: baolsec-api
    static_configs:
      - targets: ["api:9107"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
