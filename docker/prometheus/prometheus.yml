# BaolSec — Prometheus (C18, EF-12)
# Interrogation toutes les 15 s ; un service est déclaré indisponible après 2 interrogations sans
# réponse (règle ServiceIndisponible, alerts.yml). Cibles : noms de services de la pile
# (infrastructure/compose/compose.yaml) et port réel de /metrics de chaque service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: baolsec

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ingestion-gateway
    static_configs:
      - targets: ["ingestion-gateway:9000"]
  - job_name: normalization-worker
    static_configs:
      - targets: ["normalization-worker:9000"]
  - job_name: detection-worker
    static_configs:
      - targets: ["detection-worker:9000"]
  - job_name: incident-builder
    static_configs:
      - targets: ["incident-builder:9000"]
  - job_name: coverage-worker
    static_configs:
      - targets: ["coverage-worker:9001"]
  - job_name: indexing-worker
    static_configs:
      - targets: ["indexing-worker:9106"]
  - job_name: baolsec-api
    # L'API sert /metrics sur son port principal (main.py), pas sur un port dédié.
    static_configs:
      - targets: ["baolsec-api:8000"]
  - job_name: dlq-monitor
    # File de rejet, volume des flux et retard des consommateurs JetStream (dlq_admin.py metrics)
    static_configs:
      - targets: ["dlq-monitor:9102"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
