# BaolSec — Fluent Bit (C18)
# Collecte les logs Docker des services BaolSec, les parse en JSON
# et les envoie à OpenSearch.

[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

[FILTER]
    Name   parser
    Match  baolsec.*
    Key_Name log
    Parser json_log
    Reserve_Data On
    Preserve_Key Off

[FILTER]
    Name  record_modifier
    Match baolsec.*
    Record platform baolsec

[OUTPUT]
    Name            opensearch
    Match           baolsec.*
    Host            opensearch
    Port            9200
    Index           baolsec-logs
    Type            _doc
    Logstash_Format On
    Logstash_Prefix baolsec-logs
    Time_Key        @timestamp
    Replace_Dots    On
    Retry_Limit     5
    Suppress_Type_Name On

[OUTPUT]
    Name  stdout
    Match baolsec.*
    Format json_lines
