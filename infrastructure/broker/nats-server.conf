# Serveur NATS de BaolSec (ADR 0002).
# Le jeton est lu dans la variable d'environnement BROKER_TOKEN (fichier .env, jamais versionné).

server_name: baolsec-broker
port: 4222
http_port: 8222          # /healthz et /varz pour la supervision (réseau interne uniquement)

authorization {
  token: $BROKER_TOKEN
}

jetstream {
  store_dir: /data
  # 1 s : perte maximale d'une seconde en cas de coupure de courant ou de plantage du système.
  # Passer à "always" si la mesure sur la machine de démonstration tient ENF-02 (ADR 0002).
  sync_interval: 1s
  max_file_store: 50G
  max_memory_store: 256M
}

max_payload: 1MB
