# Docker Compose BaolSec — pile applicative complète (C18).
# Depuis la racine du dépôt : docker compose up -d   (compose.yaml racine inclut ce fichier et ajoute
# Prometheus et Grafana), ou directement : docker compose -f infrastructure/compose/compose.yaml up -d
# Prérequis : .env rempli (voir .env.example) et make gateway-dev (certificats de développement).

name: baolsec

services:
  broker:
    image: nats:2.15.2-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    environment:
      BROKER_TOKEN: ${BROKER_TOKEN:?BROKER_TOKEN manquant dans .env}
    volumes:
      - ../broker/nats-server.conf:/etc/nats/nats-server.conf:ro
      - broker-data:/data
    ports:
      - "127.0.0.1:4222:4222"   # développement uniquement : jamais exposé hors de la machine
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [internal]

  broker-init:
    build:
      context: ../
      dockerfile: broker/Dockerfile
    environment:
      BROKER_URL: nats://broker:4222
      BROKER_TOKEN: ${BROKER_TOKEN}
    depends_on:
      broker:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  # Taille de la file de rejet pour Prometheus (C11) : baolsec_dlq_messages{service,reason_code},
  # baolsec_dlq_bytes, baolsec_dlq_oldest_age_seconds. Port 9102 sur le réseau interne uniquement.
  dlq-monitor:
    build:
      context: ../
      dockerfile: broker/Dockerfile
    command: ["python", "broker/dlq_admin.py", "metrics", "--port", "9102", "--interval", "15"]
    environment:
      BROKER_URL: nats://broker:4222
      BROKER_TOKEN: ${BROKER_TOKEN}
    depends_on:
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/metrics', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 4
    restart: unless-stopped
    networks: [internal]

  # --- Base PostgreSQL (C4 ; socle de C19 avancé pour C12 à C17) ---------------------------
  postgresql:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]
    environment:
      POSTGRES_DB: baolsec
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # développement uniquement : outils et tests depuis la machine
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "baolsec"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [internal]

    # --- OpenSearch (C19) : moteur d'indexation et de recherche --------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      cluster.name: baolsec
      node.name: opensearch-node1
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:?OPENSEARCH_PASSWORD manquant dans .env}
      plugins.security.ssl.http.enabled: "true"
      plugins.security.ssl.http.pemcert_filepath: esnode.pem
      plugins.security.ssl.http.pemkey_filepath: esnode-key.pem
      plugins.security.ssl.http.pemtrustedcas_filepath: root-ca.pem
      DISABLE_INSTALL_DEMO_CONFIG: "false"
      # Dépôt des instantanés quotidiens (ES-09, service opensearch-maintenance)
      path.repo: /usr/share/opensearch/snapshots
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - opensearch-snapshots:/usr/share/opensearch/snapshots
    ports:
      - "127.0.0.1:9200:9200"   # développement uniquement
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:${OPENSEARCH_PASSWORD} https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks: [internal]

  db-migrate:
    build:
      context: ../
      dockerfile: database/Dockerfile
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgresql:5432/baolsec
      SVC_API_PASSWORD: ${SVC_API_PASSWORD:-}
      SVC_PASSERELLE_PASSWORD: ${SVC_PASSERELLE_PASSWORD:-}
      SVC_NORMALISATION_PASSWORD: ${SVC_NORMALISATION_PASSWORD:-}
      SVC_DETECTION_PASSWORD: ${SVC_DETECTION_PASSWORD:-}
      SVC_INCIDENTS_PASSWORD: ${SVC_INCIDENTS_PASSWORD:-}
      SVC_COUVERTURE_PASSWORD: ${SVC_COUVERTURE_PASSWORD:-}
    depends_on:
      postgresql:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  ingestion-gateway:
    build:
      context: ../..
      dockerfile: services/ingestion-gateway/Dockerfile
    environment:
      BROKER_URL: nats://broker:4222
      BROKER_TOKEN: ${BROKER_TOKEN}
      # Référentiel des sources : fichier de développement par défaut (les tests de C6 le modifient) ;
      # base PostgreSQL avec GATEWAY_SOURCE_REGISTRY=postgres et GATEWAY_POSTGRES_DSN (compte svc_passerelle)
      # dans .env, après make db-seed (infrastructure/database/README.md).
      GATEWAY_SOURCE_REGISTRY: ${GATEWAY_SOURCE_REGISTRY:-file}
      GATEWAY_POSTGRES_DSN: ${GATEWAY_POSTGRES_DSN:-}
      GATEWAY_SOURCES_FILE: /run/baolsec/dev/sources.json
      GATEWAY_SOURCES_REFRESH_S: "5"
      GATEWAY_TLS_CERT: /run/baolsec/dev/gateway.crt
      GATEWAY_TLS_KEY: /run/baolsec/dev/gateway.key
      GATEWAY_SYSLOG_CLIENT_CA: /run/baolsec/dev/sources-ca.crt
    volumes:
      - ../tls/dev:/run/baolsec/dev:ro     # créé par scripts/development/init_dev_gateway.sh
    ports:
      - "8443:8443"     # HTTPS : agents Fluent Bit
      - "6514:6514"     # Syslog TLS : équipements qui émettent directement en TLS
    depends_on:
      broker:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    networks: [internal]

  normalization-worker:
    build:
      context: ../..
      dockerfile: services/normalization-worker/Dockerfile
    environment:
      BROKER_URL: nats://broker:4222
      BROKER_TOKEN: ${BROKER_TOKEN}
      # Référentiel des sources (enrichissement, C10) : même fichier que la passerelle par défaut ;
      # base PostgreSQL avec NORMALIZER_SOURCE_REGISTRY=postgres et NORMALIZER_POSTGRES_DSN
      # (compte svc_normalisation) dans .env.
      NORMALIZER_SOURCE_REGISTRY: ${NORMALIZER_SOURCE_REGISTRY:-file}
      NORMALIZER_POSTGRES_DSN: ${NORMALIZER_POSTGRES_DSN:-}
      NORMALIZER_SOURCES_FILE: /run/baolsec/dev/sources.json
      NORMALIZER_SOURCES_REFRESH_S: "5"
      NORMALIZER_SYSLOG_TIMEZONE: ${NORMALIZER_SYSLOG_TIMEZONE:-UTC}
      NORMALIZER_INTERNAL_NETWORKS: ${NORMALIZER_INTERNAL_NETWORKS:-}
    volumes:
      - ../tls/dev:/run/baolsec/dev:ro
    depends_on:
      broker:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    # Pas de port publié : le service ne fait que lire et écrire dans le broker.
    # Plusieurs instances se partagent le flux : docker compose up -d --scale normalization-worker=2
    restart: unless-stopped
    stop_grace_period: 20s     # termine le lot en cours avant l'arrêt
    networks: [internal]

  # --- Détection (C12, C14) ------------------------------------------------------------------
  detection-worker:
    build:
      context: ../..
      dockerfile: services/detection-worker/Dockerfile
    environment:
      BROKER_URL: nats://broker:4222
      BROKER_TOKEN: ${BROKER_TOKEN}
      # Règles lues dans config.rules (compte svc_detection, lecture seule), chargées par make rules-load
      DETECTOR_RULES_SOURCE: ${DETECTOR_RULES_SOURCE:-postgres}
      DETECTOR_POSTGRES_DSN: postgresql://svc_detection:${SVC_DETECTION_PASSWORD}@postgresql:5432/baolsec
      DETECTOR_RULES_REFRESH_S: ${DETECTOR_RULES_REFRESH_S:-30}
      DETECTOR_PENDING_INTERVAL_S: ${DETECTOR_PENDING_INTERVAL_S:-60}
    depends_on:
      broker-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    # Pas de port publié. Plusieurs instances : docker compose up -d --scale detection-worker=2
    restart: unless-stopped
    stop_grace_period: 20s
    networks: [internal]

  # --- Incidents : état et suivi des alertes (C15) -------------------------------------------
  incident-builder:
    build:
      context: ../..
      dockerfile: services/incident-builder/Dockerfile
    environment:
      BROKER_URL: nats://broker:4222
      BROKER_TOKEN: ${BROKER_TOKEN}
      # Compte svc_incidents : seul écrivain du schéma incidents (C4 2.2)
      INCIDENTS_POSTGRES_DSN: postgresql://svc_incidents:${SVC_INCIDENTS_PASSWORD}@postgresql:5432/baolsec
      # Secret partagé avec l'API pour POST /commands (min. 32 caractères : openssl rand -hex 32).
      # Vide = le service refuse de démarrer ; make incidents-up le contrôle avant.
      INCIDENTS_COMMAND_TOKEN: ${INCIDENTS_COMMAND_TOKEN:-}
    depends_on:
      broker-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    # Pas de port publié : l'API joint http://incident-builder:9000/commands sur le réseau interne.
    restart: unless-stopped
    stop_grace_period: 20s
    networks: [internal]

  # --- Indexation OpenSearch (C19) : NORMALIZED_EVENTS, ALERTS, INCIDENTS → OpenSearch ---------
  indexing-worker:
    build:
      context: ../..
      dockerfile: services/indexing-worker/Dockerfile
    environment:
      NATS_URL: nats://broker:4222
      NATS_TOKEN: ${BROKER_TOKEN}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-https://opensearch:9200}
      OPENSEARCH_USER: ${OPENSEARCH_USER:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      # Certificat de démonstration d'OpenSearch : chiffré mais non vérifiable sans son CA.
      # En production : OPENSEARCH_CA_CERT=<chemin du CA monté> et OPENSEARCH_VERIFY_CERTS=true.
      OPENSEARCH_CA_CERT: ${OPENSEARCH_CA_CERT:-}
      OPENSEARCH_VERIFY_CERTS: ${OPENSEARCH_VERIFY_CERTS:-false}
    depends_on:
      broker-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9106/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 20s
    networks: [internal]

  # --- Couverture des sources (C17) : RAW_EVENTS, NORMALIZED_EVENTS → PostgreSQL --------------
  coverage-worker:
    build:
      context: ../..
      dockerfile: services/coverage-worker/Dockerfile
    environment:
      BROKER_URL: nats://broker:4222
      BROKER_TOKEN: ${BROKER_TOKEN}
      # Compte svc_couverture : écrivain du schéma couverture, lecteur de config.sources (C4 2.2)
      COVERAGE_POSTGRES_DSN: postgresql://svc_couverture:${SVC_COUVERTURE_PASSWORD}@postgresql:5432/baolsec
    depends_on:
      broker-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 20s
    networks: [internal]

    # --- API centrale BaolSec : authentification, gestion et consultation ------------------------
  baolsec-api:
    build:
      context: ../..
      dockerfile: services/baolsec-api/Dockerfile
    environment:
      POSTGRES_DSN: postgresql://svc_api:${SVC_API_PASSWORD}@postgresql:5432/baolsec
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USER: ${OPENSEARCH_USER:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      # Sans ces deux variables l'API refusait de démarrer (HTTPS sans CA) : même choix que
      # indexing-worker en développement ; en production, fournir OPENSEARCH_CA_CERT.
      OPENSEARCH_CA_CERT: ${OPENSEARCH_CA_CERT:-}
      OPENSEARCH_VERIFY_CERTS: ${OPENSEARCH_VERIFY_CERTS:-false}
      # File de rejet (GET /dlq, lecture seule) et état des flux pour la page Supervision
      BROKER_URL: nats://broker:4222
      BROKER_TOKEN: ${BROKER_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost:8443,https://localhost}
      FORWARDED_ALLOW_IPS: "*"     # en-têtes X-Forwarded-* posés par le relais nginx de l'interface
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "15"
      JWT_REFRESH_EXPIRE_MINUTES: "480"
      COMMAND_TOKEN: ${INCIDENTS_COMMAND_TOKEN}
      INCIDENTS_COMMAND_URL: http://incident-builder:9000/commands
      INCIDENTS_COMMAND_TIMEOUT_S: "10"
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9107"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      incident-builder:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      internal:
        aliases: [api]          # nom utilisé par le relais nginx de l'interface

  # --- Interface web (C22, C23) : HTTPS uniquement (ES-04), relais /api vers baolsec-api ---------
  frontend:
    build:
      context: ../../frontend
    volumes:
      - ../tls/dev/frontend.crt:/etc/nginx/certs/frontend.crt:ro   # make gateway-dev
      - ../tls/dev/frontend.key:/etc/nginx/certs/frontend.key:ro
    environment:
      FRONTEND_HTTPS_PORT: ${FRONTEND_HTTPS_PORT:-443}   # cible de la redirection HTTP → HTTPS
    ports:
      - "${FRONTEND_HTTPS_PORT:-443}:443"
      - "${FRONTEND_HTTP_PORT:-80}:80"       # redirige vers HTTPS
    depends_on:
      baolsec-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

  # --- Sauvegarde quotidienne de PostgreSQL (ES-09) ----------------------------------------
  backup:
    image: postgres:17-alpine
    entrypoint: ["sh", "/opt/baolsec/pg_backup.sh"]
    environment:
      PGHOST: postgresql
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: baolsec
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ../backup/pg_backup.sh:/opt/baolsec/pg_backup.sh:ro
      - postgres-backups:/backups
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [internal]

  # --- Instantané quotidien et rétention des index OpenSearch (ES-09) ----------------------
  opensearch-maintenance:
    build:
      context: ../..
      dockerfile: services/indexing-worker/Dockerfile
    command: ["python", "-m", "indexing_worker.maintenance"]
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL:-https://opensearch:9200}
      OPENSEARCH_USER: ${OPENSEARCH_USER:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_CA_CERT: ${OPENSEARCH_CA_CERT:-}
      OPENSEARCH_VERIFY_CERTS: ${OPENSEARCH_VERIFY_CERTS:-false}
      RETENTION_DAYS: ${EVENTS_RETENTION_DAYS:-90}
      SNAPSHOT_KEEP: ${SNAPSHOT_KEEP:-14}
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

  # --- Collecte (C7) : services de test, démarrés avec le profil « agents-test » -------------
  agent-test:
    profiles: ["agents-test"]
    image: fluent/fluent-bit:5.1.5
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/agents/test/fluent-bit-test.yaml"]
    env_file: ../tls/dev/agent-test.env          # créé par scripts/development/init_dev_gateway.sh
    environment:
      BAOLSEC_GATEWAY_HOST: ingestion-gateway
      BAOLSEC_GATEWAY_PORT: "8443"
      BAOLSEC_CA_FILE: /run/baolsec/dev/sources-ca.crt
      BAOLSEC_STATE_DIR: /var/lib/baolsec-agent
      BAOLSEC_BUFFER_LIMIT: 256M
      BAOLSEC_TEST_LOG: /logs/auth-test.log
    volumes:
      - ../../agents/fluent-bit:/agents:ro
      - ../tls/dev:/run/baolsec/dev:ro
      - ../../test-data/runtime/agent:/logs:ro
      - agent-test-state:/var/lib/baolsec-agent
    depends_on:
      ingestion-gateway:
        condition: service_healthy
    networks: [internal]

  syslog-collector:
    profiles: ["agents-test"]
    image: fluent/fluent-bit:5.1.5
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/agents/syslog-collector/fluent-bit.yaml"]
    env_file: ../tls/dev/collector.env          # jeton de la source dev-pfsense
    environment:
      BAOLSEC_GATEWAY_HOST: ingestion-gateway
      BAOLSEC_GATEWAY_PORT: "8443"
      BAOLSEC_CA_FILE: /run/baolsec/dev/sources-ca.crt
      BAOLSEC_STATE_DIR: /var/lib/baolsec-agent
      BAOLSEC_BUFFER_LIMIT: 256M
      BAOLSEC_LISTEN_PORT: "514"
    volumes:
      - ../../agents/fluent-bit:/agents:ro
      - ../tls/dev:/run/baolsec/dev:ro
      - collector-state:/var/lib/baolsec-agent
    ports:
      - "127.0.0.1:5514:514/udp"     # tests : simule pfSense
    depends_on:
      ingestion-gateway:
        condition: service_healthy
    # Deux réseaux : « sources » côté pfSense, « internal » vers la passerelle. Le test de coupure
    # ne débranche que « internal » : le collecteur continue de recevoir et garde les messages sur disque.
    networks: [sources, internal]

volumes:
  broker-data:
  postgres-data:
  postgres-backups:
  opensearch-snapshots:
  agent-test-state:
  collector-state:
  opensearch-data:

networks:
  internal:
    name: baolsec-internal
  sources:
    name: baolsec-sources