# Migrations du schéma PostgreSQL de BaolSec (C4). L'adresse de la base vient de DATABASE_ADMIN_URL.
[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s %(message)s
